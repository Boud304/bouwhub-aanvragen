<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Bouwhub Aanvragen</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: donkere demostrook met rolkeuze, witte vaste kop met logo en tabs, één werkkolom van 1040px op lichtgrijze ondergrond, panelen met dunne lijnen en kleine hoeken */
:root {
  color-scheme: light;
  --bg: #F3F5F7;
  --surface: #FFFFFF;
  --surface-2: #F6F8FA;
  --line: #E1E6EB;
  --line-strong: #C7D0D9;
  --ink: #2E3644;
  --ink-2: #4E5868;
  --muted: #6B7585;
  --brand-green: #00AC4F;
  --green: #00873E;
  --green-hover: #00702F;
  --on-green: #FFFFFF;
  --green-soft: #EAF7EF;
  --green-line: #BFE6CD;
  --green-ink: #00733A;
  --dots: #DCE5EB;
  --strip: #2E3644;
  --strip-2: #3C4555;
  --on-strip: #F2F5F8;
  --on-strip-2: #AEB8C6;
  --danger: #B42318;
  --danger-soft: #FDEEEC;
  --focus: #00AC4F;
  --demo-bg: #FFF5D9;
  --demo-ink: #6E4E00;
  --demo-line: #EDD38E;
  --chart: #00A04A;
  --chart-2: #A7DCBB;
  --p-aan-bg: #FFF4D6; --p-aan-fg: #6E4E00;
  --p-bev-bg: #E6F6EC; --p-bev-fg: #00703A;
  --p-plan-bg: #E9EEF6; --p-plan-fg: #27416B;
  --p-weg-bg: #DDE7F6; --p-weg-fg: #173A6B;
  --p-opslag-bg: #E2F1F3; --p-opslag-fg: #1D5660;
  --p-klaar-bg: #EEF1F4; --p-klaar-fg: #4B5563;
  --p-stop-bg: #FCEBE9; --p-stop-fg: #9B2C24;
  --shadow: 0 8px 28px rgba(46, 54, 68, .14);
  --font: 'Barlow', 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
  --r: 6px;
  --r-sm: 4px;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
h1, h2, h3 { font-family: var(--font); font-weight: 600; line-height: 1.15; margin: 0; text-wrap: balance; color: var(--ink); letter-spacing: -.005em; }
h1 { font-size: clamp(1.7rem, 1.4rem + 1.2vw, 2.1rem); }
h2 { font-size: 1.25rem; }
h3 { font-size: 1.05rem; }
p { margin: 0; }
a { color: var(--green-ink); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.num, td, .rij-id, .stat-waarde { font-variant-numeric: tabular-nums; }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.breed { max-width: 1040px; margin: 0 auto; }

/* Demostrook */
.demo-strook { background: var(--strip); color: var(--on-strip); font-size: .86rem; }
.demo-in { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding-block: 8px; }
.demo-tekst { color: var(--on-strip-2); margin-right: auto; min-width: 0; }
.demo-strook .demo-tag { background: transparent; color: var(--on-strip); border-color: var(--on-strip-2); }
.kop-keuzes { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.kop-keuze { display: flex; align-items: center; gap: 6px; }
.kop-keuze label { font-size: .72rem; text-transform: uppercase; letter-spacing: .12em; color: var(--on-strip-2); white-space: nowrap; }
.kop-keuze select { background-color: var(--strip-2); color: var(--on-strip); border: 1px solid var(--strip-2); border-radius: var(--r-sm); padding: 5px 30px 5px 10px; min-height: 36px; appearance: none; max-width: 100%;
  background-image: linear-gradient(45deg, transparent 50%, var(--on-strip-2) 50%), linear-gradient(135deg, var(--on-strip-2) 50%, transparent 50%);
  background-position: calc(100% - 15px) 52%, calc(100% - 10px) 52%; background-size: 5px 5px; background-repeat: no-repeat; }
.knop-kop { background: transparent; border: 1px solid var(--on-strip-2); color: var(--on-strip); border-radius: var(--r-sm); padding: 5px 12px; min-height: 36px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
.knop-kop:hover { background: var(--strip-2); }
.teller { background: var(--brand-green); color: var(--on-green); border-radius: 3px; font-size: .74rem; font-weight: 700; padding: 0 6px; }

/* Kop met logo */
.kop { background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; }
.kop-in { display: flex; align-items: stretch; gap: 8px 32px; min-height: 68px; flex-wrap: wrap; }
.logo { background: none; border: 0; cursor: pointer; padding-inline: 0; color: inherit; display: flex; align-items: center; gap: 14px; text-decoration: none; padding-block: 12px; flex: none; }
.logo img { height: 38px; width: auto; display: block; }
.logo-app { border-left: 1px solid var(--line); padding-left: 14px; font-size: .78rem; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); line-height: 1.2; }
.nav { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; margin-left: auto; align-items: stretch; }
.nav::-webkit-scrollbar { display: none; }
.nav button { background: none; border: 0; color: var(--ink-2); padding: 0 14px; cursor: pointer; white-space: nowrap; font-weight: 600; font-size: .98rem; border-bottom: 3px solid transparent; border-top: 3px solid transparent; }
.nav button:hover { color: var(--ink); background: var(--surface-2); }
.nav button[aria-current="page"] { color: var(--ink); border-bottom-color: var(--brand-green); }

.demo-tag { display: inline-block; background: var(--demo-bg); color: var(--demo-ink); border: 1px solid var(--demo-line); font-size: .68rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; border-radius: 3px; padding: 0 6px; line-height: 1.6; vertical-align: 2px; white-space: nowrap; }

.reset-balk { background: var(--danger-soft); border-bottom: 1px solid var(--line); }
.reset-balk .breed { padding-block: 12px; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }

main { padding-block: 32px 72px; }
.pagina { display: grid; gap: 24px; }
.eyebrow { font-size: .76rem; text-transform: uppercase; letter-spacing: .16em; color: var(--green-ink); font-weight: 600; }
.sub { color: var(--ink-2); max-width: 65ch; }
.intro { display: grid; gap: 6px; }

/* Knoppen */
.knop { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 8px 18px; border-radius: var(--r-sm); border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); font-weight: 600; cursor: pointer; text-decoration: none; }
.knop:hover { background: var(--surface-2); border-color: var(--ink-2); }
.knop.primair { background: var(--green); border-color: var(--green); color: var(--on-green); }
.knop.primair:hover { background: var(--green-hover); border-color: var(--green-hover); }
.knop.gevaar { background: var(--danger); border-color: var(--danger); color: var(--on-green); }
.knop.gevaar-licht { color: var(--danger); }
.knop.klein { min-height: 36px; padding: 4px 12px; font-size: .92rem; }
.knop.link { border: 0; background: none; color: var(--green-ink); padding-inline: 0; min-height: 36px; }
.knop.link:hover { text-decoration: underline; background: none; }
.terug { justify-self: start; }
.knoppen { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

/* Keuzetegels */
.tegels { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
.tegel { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; cursor: pointer; display: grid; grid-template-columns: 48px minmax(0, 1fr) auto; gap: 4px 16px; align-items: center; }
.tegel:hover { border-color: var(--brand-green); }
.tegel-icoon { grid-row: span 2; width: 48px; height: 48px; border-radius: var(--r-sm); background: var(--green-soft); color: var(--green-ink); display: grid; place-items: center; }
.tegel-titel { font-size: 1.2rem; font-weight: 600; color: var(--ink); }
.tegel-pijl { grid-row: span 2; grid-column: 3; color: var(--green-ink); font-size: 1.3rem; }
.tegel-tekst { color: var(--ink-2); grid-column: 2; }

/* Tabs */
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.tabs button { background: none; border: 0; padding: 10px 2px; margin-right: 18px; font-weight: 600; color: var(--muted); border-bottom: 3px solid transparent; cursor: pointer; margin-bottom: -1px; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--brand-green); }

/* Lijst met aanvragen: één paneel met rijen */
.lijst { list-style: none; margin: 0; padding: 0; display: grid; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.lijst > li + li { border-top: 1px solid var(--line); }
.rij { width: 100%; text-align: left; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 16px; align-items: center; background: var(--surface); border: 0; padding: 14px 18px; cursor: pointer; }
.rij:hover { background: var(--surface-2); }
.rij-links { display: grid; gap: 1px; min-width: 0; }
.rij-boven { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: .84rem; color: var(--muted); }
.rij-id { font-weight: 600; color: var(--ink-2); }
.rij-titel { font-weight: 600; font-size: 1.05rem; color: var(--ink); }
.rij-meta { color: var(--ink-2); font-size: .93rem; }
.type { font-size: .72rem; font-weight: 600; text-transform: uppercase; letter-spacing: .12em; }
.pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 3px; padding: 2px 9px; font-size: .84rem; font-weight: 600; white-space: nowrap; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 1px; background: currentColor; }
.p-aan { background: var(--p-aan-bg); color: var(--p-aan-fg); }
.p-bev { background: var(--p-bev-bg); color: var(--p-bev-fg); }
.p-plan { background: var(--p-plan-bg); color: var(--p-plan-fg); }
.p-weg { background: var(--p-weg-bg); color: var(--p-weg-fg); }
.p-opslag { background: var(--p-opslag-bg); color: var(--p-opslag-fg); }
.p-klaar { background: var(--p-klaar-bg); color: var(--p-klaar-fg); }
.p-stop { background: var(--p-stop-bg); color: var(--p-stop-fg); }
.projectrij { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 16px; align-items: center; padding: 14px 18px; }
.projectrij-rechts { display: grid; gap: 8px; justify-items: end; }
.aanmelding { border: 1px solid var(--line); border-radius: var(--r-sm); padding: 16px; display: grid; gap: 12px; background: var(--surface-2); }
.aanmelding h3 { font-size: 1.1rem; }
.aanmelding-actie { display: flex; flex-wrap: wrap; gap: 10px 12px; align-items: end; }
.aanmelding-actie .veld { flex: 1 1 220px; max-width: 320px; }
.aanmeldingen { border-color: var(--demo-line); }
.rit-tag { font-weight: 600; }
.b-rit { font-size: .72rem; font-weight: 600; margin-top: 2px; }
.r-nieuw { color: var(--p-aan-fg); }
.r-geaccepteerd { color: var(--green-ink); }
.r-voorstel { color: var(--p-plan-fg); }
.r-geweigerd { color: var(--danger); }
.kengetal.statisch { cursor: default; }
.kengetal.statisch:hover { border-color: var(--line); }
.leeg { padding: 32px 20px; text-align: center; color: var(--muted); border: 1px dashed var(--line-strong); border-radius: var(--r); background: var(--surface); }

/* Panelen */
.blok { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; display: grid; gap: 14px; min-width: 0; }
.blok > h2 { font-size: 1.15rem; }
.blok-kop { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.notitie { color: var(--ink-2); font-size: .92rem; }
details.blok { padding-block: 14px; }
details.blok > summary { cursor: pointer; font-weight: 600; font-size: 1.05rem; list-style: none; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
details.blok > summary::-webkit-details-marker { display: none; }
details.blok > summary::after { content: "Openen"; margin-left: auto; font-size: .86rem; font-weight: 600; color: var(--green-ink); }
details.blok[open] > summary::after { content: "Sluiten"; }

/* Formulier */
.formulier { display: grid; gap: 20px; }
.form-kop { display: grid; gap: 6px; }
fieldset.sectie { border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); padding: 20px; margin: 0; display: grid; gap: 18px; min-width: 0; }
fieldset.sectie > legend { float: left; width: 100%; padding: 0 0 12px; margin: 0; border-bottom: 1px solid var(--line); font-size: .78rem; font-weight: 600; text-transform: uppercase; letter-spacing: .16em; color: var(--ink-2); }
.rij-velden { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 18px; }
.veld { display: grid; gap: 6px; min-width: 0; }
.veld > label, .veld > legend, .veld-label { font-weight: 600; color: var(--ink); padding: 0; }
.ster { color: var(--danger); margin-left: 2px; }
.hint { color: var(--muted); font-size: .9rem; }
input[type="text"], input[type="tel"], input[type="email"], input[type="number"], input[type="date"], select, textarea {
  width: 100%; min-height: 44px; padding: 8px 12px; border: 1px solid var(--line-strong); border-radius: var(--r-sm); background: var(--surface); color: var(--ink);
}
textarea { min-height: 84px; resize: vertical; }
select { appearance: none; padding-right: 36px;
  background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
  background-position: calc(100% - 18px) 52%, calc(100% - 13px) 52%; background-size: 5px 5px; background-repeat: no-repeat; }
input:hover, select:hover, textarea:hover { border-color: var(--muted); }
input:focus, select:focus, textarea:focus { border-color: var(--brand-green); outline: 2px solid var(--green-line); outline-offset: 0; }
.heeft-fout input, .heeft-fout select, .heeft-fout textarea, input[aria-invalid="true"], select[aria-invalid="true"] { border-color: var(--danger); box-shadow: inset 0 0 0 1px var(--danger); }
.fout { color: var(--danger); font-size: .9rem; font-weight: 600; }
fieldset.veld { border: 0; margin: 0; padding: 0; min-width: 0; }
.segment { display: inline-flex; flex-wrap: wrap; gap: 8px; }
.segment label { position: relative; }
.segment input { position: absolute; opacity: 0; inset: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
.segment span { display: inline-flex; align-items: center; min-height: 42px; padding: 6px 16px; border: 1px solid var(--line-strong); border-radius: var(--r-sm); background: var(--surface); font-weight: 600; cursor: pointer; }
.segment label:hover span { border-color: var(--muted); }
.segment input:checked + span { background: var(--green-soft); border-color: var(--green); color: var(--green-ink); box-shadow: inset 0 0 0 1px var(--green); }
.segment input:focus-visible + span { outline: 2px solid var(--focus); outline-offset: 2px; }
.heeft-fout .segment span { border-color: var(--danger); }
.info-kaart { background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 12px 14px; font-size: .93rem; color: var(--ink-2); display: grid; gap: 2px; }
.info-kaart strong { color: var(--ink); }
.regels { display: grid; gap: 10px; }
.regel { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr) minmax(0, 1.4fr) auto; gap: 10px; align-items: end; padding: 12px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface-2); }
.regel .veld label { font-size: .86rem; }
.regel-toel, .regel-fout { grid-column: 1 / -1; }
.knop-weg { min-height: 44px; min-width: 44px; border: 1px solid var(--line-strong); background: var(--surface); border-radius: var(--r-sm); cursor: pointer; color: var(--danger); font-weight: 700; }
.fout-samenvatting { background: var(--danger-soft); color: var(--danger); border: 1px solid var(--danger); border-radius: var(--r-sm); padding: 12px 16px; font-weight: 600; }
.verzend { position: sticky; bottom: 0; background: var(--surface); margin-inline: -1px; padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px)); border: 1px solid var(--line); border-radius: var(--r) var(--r) 0 0; display: flex; gap: 10px; flex-wrap: wrap; z-index: 5; }
.bestand { display: grid; gap: 6px; }
input[type="file"] { padding: 10px; border: 1px dashed var(--line-strong); border-radius: var(--r-sm); background: var(--surface-2); width: 100%; max-width: 100%; }

/* Detail */
.detail-kop { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px 20px; flex-wrap: wrap; }
.detail-kop > div { display: grid; gap: 4px; min-width: 0; }
.detail-grid { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 20px; align-items: start; }
.detail-grid.gelijk { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.actiebalk { display: grid; gap: 12px; background: var(--green-soft); border: 1px solid var(--green-line); border-radius: var(--r); padding: 16px 18px; }
.actiebalk.rustig { background: var(--surface-2); border-color: var(--line); }
form.actiebalk { background: var(--surface); border-color: var(--line-strong); }
.verloop { list-style: none; margin: 0; padding: 0; display: grid; }
.stap { display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 12px; position: relative; padding-bottom: 18px; }
.stap:last-child { padding-bottom: 0; }
.stap::before { content: ""; position: absolute; left: 9px; top: 20px; bottom: 0; width: 2px; background: var(--line); }
.stap:last-child::before { display: none; }
.stap.gedaan::before { background: var(--brand-green); }
.stip { width: 20px; height: 20px; border-radius: 4px; border: 2px solid var(--line-strong); background: var(--surface); display: grid; place-items: center; z-index: 1; }
.stap.gedaan .stip { background: var(--brand-green); border-color: var(--brand-green); }
.stap.gedaan .stip::after { content: ""; width: 5px; height: 9px; border: solid var(--on-green); border-width: 0 2px 2px 0; transform: rotate(45deg) translate(-1px, -1px); }
.stap.huidig .stip { border-color: var(--brand-green); box-shadow: 0 0 0 3px var(--green-soft); }
.stap.huidig .stip::after { content: ""; width: 8px; height: 8px; border-radius: 2px; background: var(--brand-green); }
.stap.stop .stip { background: var(--danger); border-color: var(--danger); }
.stap-naam { font-weight: 600; }
.stap.later .stap-naam { color: var(--muted); font-weight: 500; }
.stap-meta { font-size: .86rem; color: var(--ink-2); }
.notities { list-style: none; margin: 0; padding: 12px 0 0; display: grid; gap: 8px; border-top: 1px solid var(--line); }
.notities li { font-size: .9rem; color: var(--ink-2); }
dl.gegevens { margin: 0; display: grid; grid-template-columns: minmax(120px, 34%) minmax(0, 1fr); gap: 8px 16px; }
dl.gegevens dt { color: var(--muted); font-size: .93rem; }
dl.gegevens dd { margin: 0; overflow-wrap: anywhere; }
.groep-kop { grid-column: 1 / -1; font-size: .74rem; font-weight: 600; text-transform: uppercase; letter-spacing: .16em; color: var(--green-ink); border-top: 1px solid var(--line); padding-top: 12px; margin-top: 6px; }
.groep-kop:first-child { border-top: 0; padding-top: 0; margin-top: 0; }

/* Mail en Teams voorbeelden */
.mail, .teamsbericht { border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface); overflow: hidden; }
.mail-kop { display: flex; gap: 8px; align-items: center; padding: 8px 14px; background: var(--surface-2); border-bottom: 1px solid var(--line); font-size: .85rem; font-weight: 600; color: var(--ink-2); flex-wrap: wrap; }
.mail-meta { margin: 0; padding: 12px 14px 0; display: grid; gap: 2px; font-size: .9rem; }
.mail-meta div { display: grid; grid-template-columns: 90px minmax(0, 1fr); gap: 8px; }
.mail-meta dt { color: var(--muted); }
.mail-meta dd { margin: 0; overflow-wrap: anywhere; }
.mail-tekst { padding: 12px 14px; display: grid; gap: 8px; max-width: 65ch; }
.mail-voet, .teams-voet { padding: 0 14px 12px; font-size: .8rem; color: var(--muted); }
.teamsbericht .teams-tekst { padding: 10px 14px; }
.teamsbericht .teams-tekst strong { display: block; }
.stapel { display: grid; gap: 12px; }

/* Logboek */
.log { list-style: none; margin: 0; padding: 0; display: grid; }
.log li { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 12px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: .9rem; }
.log li:last-child { border-bottom: 0; }
.log-sys { font-size: .7rem; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; background: var(--p-plan-bg); color: var(--p-plan-fg); border-radius: 3px; padding: 2px 6px; align-self: start; white-space: nowrap; }
.log-tekst { color: var(--ink); }
.log-meta { grid-column: 2; color: var(--muted); font-size: .8rem; }

/* Achter de schermen paneel */
.achter { position: fixed; z-index: 40; top: 0; right: 0; bottom: 0; width: min(440px, 100%); background: var(--surface); border-left: 1px solid var(--line); box-shadow: var(--shadow); display: flex; flex-direction: column;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-right: env(safe-area-inset-right, 0px); }
.achter-kop { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--line); }
.achter-kop > div { display: flex; gap: 10px; align-items: center; }
.achter-inhoud { overflow-y: auto; padding: 16px 20px 32px; display: grid; gap: 20px; align-content: start; }
.module { display: grid; gap: 4px; padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--r-sm); }
.module strong { font-size: 1rem; }
.module p { font-size: .88rem; color: var(--ink-2); }
.scherm { position: fixed; inset: 0; background: rgba(46, 54, 68, .4); z-index: 35; }

/* Meldingen onderin */
.toasts { position: fixed; z-index: 50; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 8px; width: min(520px, calc(100% - 32px)); }
.toast { background: var(--strip); color: var(--on-strip); border-radius: var(--r-sm); border-left: 4px solid var(--brand-green); padding: 12px 16px; box-shadow: var(--shadow); display: grid; gap: 2px; }
.toast small { color: var(--on-strip-2); }

/* Medewerker */
.samenvatting { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.kengetal { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: grid; gap: 2px; text-align: left; cursor: pointer; }
.kengetal:hover { border-color: var(--muted); }
.kengetal[aria-pressed="true"] { border-color: var(--green); box-shadow: inset 0 0 0 1px var(--green); }
.kengetal .stat-waarde { font-weight: 600; font-size: 2rem; line-height: 1.05; }
.kengetal span:last-child { color: var(--ink-2); font-size: .9rem; }
.filters { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; align-items: end; }
.filters .veld label { font-size: .78rem; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); }
.twee-kolom { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 320px); gap: 20px; align-items: start; }
.dag-groep { display: grid; gap: 10px; }
.dag-kop { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.dag-kop h2 { font-size: 1.15rem; }
.dag-kop .teller-tekst { color: var(--muted); font-size: .9rem; }
.waarschuwing { color: var(--danger); font-weight: 600; font-size: .9rem; }

/* Beheer en kerncijfers */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 18px; display: grid; gap: 4px; }
.stat-label { color: var(--muted); font-size: .76rem; text-transform: uppercase; letter-spacing: .12em; font-weight: 600; }
.stat-waarde { font-weight: 600; font-size: 2.2rem; line-height: 1.05; }
.stat-sub { color: var(--muted); font-size: .86rem; }
.balken { display: grid; gap: 8px; }
.balk-rij { display: grid; grid-template-columns: minmax(96px, 150px) minmax(0, 1fr) 36px; gap: 12px; align-items: center; font-size: .93rem; }
.balk-spoor { height: 16px; background: var(--surface-2); border-radius: 2px; }
.balk-vul { height: 100%; background: var(--chart); border-radius: 0 3px 3px 0; }
.balk-rij .num { text-align: right; font-weight: 600; }
.meter { height: 24px; border-radius: var(--r-sm); background: var(--surface-2); border: 1px solid var(--line); display: flex; overflow: hidden; gap: 2px; }
.meter-bezet { background: var(--chart); }
.meter-gereserveerd { background: var(--chart-2); }
.legenda { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: .88rem; color: var(--ink-2); }
.legenda i { display: inline-block; width: 12px; height: 12px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
.tabel-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: .95rem; }
th, td { text-align: left; padding: 12px 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: .74rem; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); font-weight: 600; background: var(--surface-2); }
tr:last-child td { border-bottom: 0; }
td.num, th.num { text-align: right; }
.nowrap, th { white-space: nowrap; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { background: var(--surface-2); border: 1px solid var(--line); border-radius: 3px; padding: 0 8px; font-size: .86rem; color: var(--ink-2); }
.vink { display: flex; gap: 10px; align-items: center; min-height: 40px; }
.vink input { width: 18px; height: 18px; accent-color: var(--green); }
.vinklijst { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 4px 16px; }

.info-lijst { margin: 0; padding-left: 20px; display: grid; gap: 6px; max-width: 70ch; }
footer { border-top: 1px solid var(--line); background: var(--surface); }
footer .breed { padding-block: 18px 32px; display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: center; color: var(--muted); font-size: .9rem; }
footer img { height: 22px; width: auto; display: block; }

/* Weekschema */
.vis-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.plan-intro { display: flex; justify-content: space-between; align-items: end; gap: 12px 20px; flex-wrap: wrap; }
.plan-intro > div:first-child { display: grid; gap: 6px; }
.schakel { display: inline-flex; border: 1px solid var(--line-strong); border-radius: var(--r-sm); overflow: hidden; background: var(--surface); }
.schakel button { border: 0; background: none; padding: 8px 16px; font-weight: 600; cursor: pointer; color: var(--ink-2); min-height: 40px; }
.schakel button + button { border-left: 1px solid var(--line-strong); }
.schakel button[aria-pressed="true"] { background: var(--ink); color: var(--on-strip); }
.week-balk { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; }
.week-titel { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-right: auto; }
.week-titel h2 { font-size: 1.4rem; }
.week-titel span { color: var(--ink-2); }
.knop:disabled { opacity: .45; cursor: default; }
.plan-filters { display: flex; gap: 8px; flex-wrap: wrap; }
.plan-filters select { width: auto; min-height: 36px; padding-block: 4px; font-size: .92rem; }
.kies-balk { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; background: var(--strip); color: var(--on-strip); border-radius: var(--r); padding: 10px 14px; }
.kies-balk .knop { background: transparent; color: var(--on-strip); border-color: var(--on-strip-2); }
.kies-balk .knop:hover { background: var(--strip-2); }
.schema-wrap { display: grid; grid-template-columns: minmax(0, 1fr) 270px; gap: 20px; align-items: start; }
.schema-scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); min-width: 0; }
.schema { display: grid; }
.schema > * { border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); min-width: 0; }
.schema-hoek, .dagkop { position: sticky; top: 0; background: var(--surface-2); z-index: 1; }
.schema-hoek { font-size: .72rem; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); font-weight: 600; padding: 10px; display: flex; align-items: end; }
.dagkop { padding: 8px 10px; display: grid; gap: 0; border-top: 3px solid transparent; }
.dagkop strong { font-weight: 600; display: block; }
.dagkop strong::first-letter { text-transform: uppercase; }
.dagkop span { font-size: .82rem; color: var(--muted); }
.dagkop.vandaag { border-top-color: var(--brand-green); background: var(--green-soft); }
.dagkop.voorbij strong { color: var(--muted); }
.tvlabel { padding: 8px 10px; font-size: .82rem; font-weight: 600; color: var(--ink-2); font-variant-numeric: tabular-nums; background: var(--surface-2); }
.vak { min-height: 96px; padding: 6px; display: grid; gap: 6px; align-content: start; position: relative; }
.vak.verleden { background: repeating-linear-gradient(135deg, var(--surface-2) 0 6px, var(--surface) 6px 12px); }
.vak.vol { background: var(--danger-soft); }
.vol-label { font-size: .72rem; font-weight: 700; color: var(--danger); text-transform: uppercase; letter-spacing: .06em; }
.vak.doel { outline: 2px dashed var(--brand-green); outline-offset: -3px; background: var(--green-soft); }
.kies-actief .vak[data-act]:hover, .kies-actief .vak[data-act]:focus-visible { background: var(--green-soft); cursor: pointer; outline: 2px dashed var(--brand-green); outline-offset: -3px; }
.blokje { text-align: left; width: 100%; font: inherit; color: var(--ink); border: 1px solid color-mix(in srgb, var(--k) 55%, white); border-top: 3px solid var(--k); background: color-mix(in srgb, var(--k) 11%, white); border-radius: var(--r-sm); padding: 5px 8px 6px; font-size: .82rem; line-height: 1.3; cursor: grab; display: grid; gap: 1px; min-width: 0; }
.blokje:hover { background: color-mix(in srgb, var(--k) 19%, white); }
.blokje:active { cursor: grabbing; }
.blokje.gewenst { border-style: dashed; border-top-style: dashed; background: var(--surface); }
.blokje.klaar { opacity: .6; cursor: pointer; }
.blokje.gekozen { outline: 2px solid var(--ink); outline-offset: 1px; }
.blokje.sleept { opacity: .4; }
.b-id { display: flex; justify-content: space-between; gap: 6px; font-size: .72rem; font-weight: 600; color: var(--ink-2); white-space: nowrap; min-width: 0; }
.b-id span:last-child { color: var(--muted); font-weight: 500; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.breed.wijd { max-width: 1400px; }
.veeg-hint { display: none; color: var(--muted); font-size: .88rem; }
.b-proj { font-weight: 600; font-size: .9rem; }
.b-meta { color: var(--ink-2); overflow-wrap: anywhere; }
.b-status { font-size: .68rem; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-2); margin-top: 2px; }
.zijlijst { display: grid; gap: 16px; }
.zij-blokken { display: grid; gap: 8px; }
.legenda-lijst { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: .9rem; color: var(--ink-2); }
.legenda-lijst i { display: inline-block; width: 14px; height: 14px; border-radius: 3px; margin-right: 8px; vertical-align: -2px; background: color-mix(in srgb, var(--k) 25%, white); border: 1px solid var(--k); border-top-width: 3px; }
.legenda-lijst.stijlen { border-top: 1px solid var(--line); padding-top: 10px; }
.legenda-lijst .l-gewenst { --k: var(--muted); background: var(--surface); border-style: dashed; }
.legenda-lijst .l-vast { --k: var(--muted); }
.legenda-lijst .l-klaar { --k: var(--muted); opacity: .5; }
.legenda-lijst .l-vol { background: var(--danger-soft); border: 1px solid var(--danger); }
@media (max-width: 960px) {
  .schema-wrap { grid-template-columns: minmax(0, 1fr); }
  .zijlijst { grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); align-items: start; }
}
@media (max-width: 760px) {
  .week-titel { margin-right: 0; width: 100%; }
  .plan-filters { width: 100%; }
  .plan-filters select { flex: 1 1 140px; }
  .veeg-hint { display: block; }
}

@media (max-width: 760px) {
  .kop-in { gap: 0; min-height: 0; }
  .logo { padding-block: 10px 6px; }
  .logo img { height: 30px; }
  .nav { margin-left: -14px; width: calc(100% + 14px); }
  .nav button { padding: 10px 11px; font-size: .95rem; }
  .demo-tekst { flex: 1 1 auto; }
  .kop-keuzes { width: 100%; }
  .kop-keuze { flex: 1 1 150px; }
  .kop-keuze select { width: 100%; }
  .kop-keuze label { display: none; }
  .detail-grid, .detail-grid.gelijk, .twee-kolom { grid-template-columns: minmax(0, 1fr); }
  .rij { grid-template-columns: minmax(0, 1fr); }
  .rij .pill { justify-self: start; }
  .projectrij { grid-template-columns: minmax(0, 1fr); }
  .projectrij-rechts { justify-items: start; }
  .regel { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .regel .veld:first-child { grid-column: 1 / -1; }
  .regel .knop-weg { grid-column: 1 / -1; justify-self: end; min-height: 36px; }
  dl.gegevens { grid-template-columns: minmax(0, 1fr); gap: 2px 0; }
  dl.gegevens dd { margin-bottom: 8px; }
  .balk-rij { grid-template-columns: 96px minmax(0, 1fr) 30px; }
  .tegel { grid-template-columns: 44px minmax(0, 1fr) auto; padding: 16px; }
  .tegel-icoon { width: 44px; height: 44px; }
}
@media (prefers-reduced-motion: no-preference) {
  .toast { animation: in .18s ease-out; }
  @keyframes in { from { transform: translateY(6px); opacity: 0; } to { transform: none; opacity: 1; } }
}
</style>

/* ---------- Datumhulpjes ---------- */
const pad = n => String(n).padStart(2, '0');
function dag(offset = 0) { const d = new Date(); d.setHours(12, 0, 0, 0); d.setDate(d.getDate() + offset); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
function moment(offsetDagen, uur, min = 0) { const d = new Date(); d.setDate(d.getDate() + offsetDagen); d.setHours(uur, min, 0, 0); return d.toISOString(); }
const nu = () => new Date().toISOString();
const DAGEN = ['zo', 'ma', 'di', 'wo', 'do', 'vr', 'za'];
const MAANDEN = ['jan', 'feb', 'mrt', 'apr', 'mei', 'jun', 'jul', 'aug', 'sep', 'okt', 'nov', 'dec'];
function plusDagen(iso, n) { const [y, m, d] = iso.split('-').map(Number); const dt = new Date(y, m - 1, d, 12); dt.setDate(dt.getDate() + n); return `${dt.getFullYear()}-${pad(dt.getMonth() + 1)}-${pad(dt.getDate())}`; }
function fmtDag(iso) {
  if (!iso) return 'niet ingevuld';
  const [y, m, d] = iso.split('-').map(Number); const dt = new Date(y, m - 1, d, 12);
  return `${DAGEN[dt.getDay()]} ${d} ${MAANDEN[m - 1]}`;
}
function dagTekst(iso) {
  if (!iso) return 'niet ingevuld';
  if (iso === dag(0)) return `Vandaag, ${fmtDag(iso)}`;
  if (iso === dag(1)) return `Morgen, ${fmtDag(iso)}`;
  if (iso === dag(-1)) return `Gisteren, ${fmtDag(iso)}`;
  return fmtDag(iso);
}
const dagKlein = iso => { const t = dagTekst(iso); return t.charAt(0).toLowerCase() + t.slice(1); };
function fmtMoment(iso) { const d = new Date(iso); return `${d.getDate()} ${MAANDEN[d.getMonth()]} om ${pad(d.getHours())}:${pad(d.getMinutes())}`; }

const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  },

  // 4PS en Business Central

  // Richting Business Central naar app: projecten van de klant en de status van elke aanvraag.

  vierPS: {
    naam: '4PS en Business Central',
    richting: 'App naar Business Central: aanvraag met ladingregels onder het projectnummer. Business Central naar app: projecten en status. Later via een eigen API pagina.',

    aanvraagBijwerken(a) { Koppelingen.log('4PS / Business Central', 'App naar BC', `Wijziging van ${a.id} naar 4PS verstuurd.`, a.id); },
    statusVastgelegd(a, status) { Koppelingen.log('4PS / Business Central', 'BC naar app', `Status van ${a.id} in Business Central vastgelegd als ${status}.`, a.id); },
    planningGewijzigd(a) { Koppelingen.log('4PS / Business Central', 'App naar BC', `Nieuwe planning van ${a.id} vastgelegd: ${fmtDag(a.gepland.datum)}, ${a.gepland.tijdvak}.`, a.id); },
    transportopdracht(a, t) { Koppelingen.log('4PS / Business Central', 'App naar BC', `Transportopdracht ${a.id} aan ${t.naam} vastgelegd in Business Central.`, a.id); },
    projectAangemeld(p) { Koppelingen.log('4PS / Business Central', 'App naar BC', `Projectaanmelding ${p.naam} als concept klaargezet. De Bouwhub maakt het project aan in 4PS.`, '', p.id); },
    projectAangemaakt(p) { Koppelingen.log('4PS / Business Central', 'BC naar app', `Project ${p.nummer} ${p.naam} aangemaakt in 4PS en gekoppeld aan de klant.`, '', p.id); },
    projectGegevens(p) { Koppelingen.log('4PS / Business Central', 'BC naar app', `Projectgegevens van ${pnr(p)} zouden uit 4PS komen. Hier alleen lokaal aangepast.`, ''); }
  },

  // SharePoint (projectmap). OneDrive is persoonlijk en wordt daarom niet gebruikt voor pakbonnen.
  // Richting app naar SharePoint: pakbon in de map Projecten/<projectnummer>/Aanvragen/<aanvraagnummer>.
  // De link naar die map gaat mee naar de aanvraag in Business Central.
  sharepoint: {
    naam: 'SharePoint',
    richting: 'App naar SharePoint: pakbon in de projectmap van de aanvraag. De link naar de map gaat mee naar Business Central.',

      const p = proj(a.projectId);
      const pad = `Projecten/${p ? (p.nummer || 'aanmelding-' + p.id) : 'onbekend'}/Aanvragen/${a.id}/${bestand.naam}`;
      Koppelingen.log('SharePoint', 'App naar SharePoint', `Pakbon opgeslagen in ${pad}.`, a.id);
      return pad;

  },

  // Outlook
  // Richting Power Automate naar de mailbox van de klant: bevestiging, wijziging en statusberichten.
  outlook: {
    naam: 'Outlook',
    richting: 'Power Automate naar de mailbox van de klant: bevestiging, wijziging en statusberichten.',
    projectMail(p, onderwerp, regels) {
      const g = gebr(p.aangemeldDoor) || gebr(UI.als) || {};
      const m = { id: 'M' + Date.now() + Math.random().toString(36).slice(2, 6), aanvraagId: '', projectId: p.id, tijd: nu(), van: CONFIG.mailAfzender, aan: `${g.naam || ''} <${g.mail || ''}>`, onderwerp, tekst: [`Beste ${voornaam(g.naam)},`, ...regels, 'Met vriendelijke groet,', CONFIG.hubNaam] };
      S.berichten.unshift(m);
      Koppelingen.log('Outlook', 'Naar klant', `Mail "${onderwerp}" klaargezet voor ${g.mail || 'de klant'}.`, '', p.id);
      return m;
    },
    _mail(a, onderwerp, regels) {
      const g = gebr(a.aanvragerId) || {};
      const m = { id: 'M' + Date.now() + Math.random().toString(36).slice(2, 6), aanvraagId: a.id, tijd: nu(), van: CONFIG.mailAfzender, aan: `${g.naam || ''} <${g.mail || ''}>`, onderwerp, tekst: [`Beste ${voornaam(g.naam)},`, ...regels, 'Met vriendelijke groet,', CONFIG.hubNaam] };
      S.berichten.unshift(m);
      Koppelingen.log('Outlook', 'Naar klant', `Mail "${onderwerp}" klaargezet voor ${g.mail || 'de klant'}.`, a.id);
      return m;
    },
    bevestiging(a) {
      const p = proj(a.projectId);
      const kern = a.type === 'transport'
        ? `Lossen: ${fmtDag(a.losdatum)}, ${a.tijdvak}. Adres: ${adresTekst(a, 'los')}.`
        : `Inslag: ${fmtDag(a.inslagdatum)}. Opslag voor ongeveer ${a.duurWeken} weken, ${m2Tekst(a.m2)} vloeroppervlak.`;
      return this._mail(a, `Ontvangen: ${typeNaam(a).toLowerCase()}aanvraag ${a.id}`, [
        `We hebben uw ${typeNaam(a).toLowerCase()}aanvraag ${a.id} ontvangen voor project ${p.naam} (${pnr(p)}).`,
        kern, `Lading: ${regelsTekst(a.regels)}.`,
        'We bevestigen de aanvraag zo snel mogelijk. U volgt de status in de aanvraagapplicatie.'
      ]);
    },
    planning(a, oud) { return this._mail(a, `Nieuwe planning: aanvraag ${a.id}`, [`De planning van uw aanvraag ${a.id} is gewijzigd.`, `Was: ${oud}.`, `Nieuw: ${fmtDag(a.gepland.datum)}, ${a.gepland.tijdvak}.`, 'Laat het ons weten als dit niet uitkomt.']); },
    wijziging(a) { return this._mail(a, `Gewijzigd: aanvraag ${a.id}`, [`Uw wijziging van aanvraag ${a.id} is ontvangen.`, 'De Bouwhub bevestigt de aanvraag opnieuw.']); },
    status(a, status, notitie) {
      const r = [`Uw aanvraag ${a.id} heeft nu de status ${status}.`];
      if (status === 'Ingepland' && a.gepland) r.push(`Gepland op ${fmtDag(a.gepland.datum)}${a.gepland.tijdvak ? ', ' + a.gepland.tijdvak : ''}.`);
      if (notitie) r.push(`Toelichting: ${notitie}`);
      return this._mail(a, `${status}: aanvraag ${a.id}`, r);
    }
  },

  // Teams
  // Richting Power Automate naar het Teams kanaal van het Bouwhub team: melding bij nieuwe, gewijzigde en geannuleerde aanvragen.
  teams: {
    naam: 'Teams',
    richting: 'Power Automate naar het Teams kanaal van het Bouwhub team: melding bij nieuwe, gewijzigde en geannuleerde aanvragen.',
    project(p, titel, tekst) {
      S.teams.unshift({ id: 'T' + Date.now() + Math.random().toString(36).slice(2, 6), aanvraagId: '', projectId: p.id, tijd: nu(), titel, tekst });
      Koppelingen.log('Teams', 'Naar Bouwhub team', `Melding in kanaal Bouwhub planning: ${titel}.`, '', p.id);
    },
    melding(a, titel, tekst) {
      S.teams.unshift({ id: 'T' + Date.now() + Math.random().toString(36).slice(2, 6), aanvraagId: a.id, tijd: nu(), titel, tekst });
      Koppelingen.log('Teams', 'Naar Bouwhub team', `Melding in kanaal Bouwhub planning: ${titel}.`, a.id);
    }
  },

  // Transportportaal
  // Richting Bouwhub naar transporteur: ingeplande rit met adressen, lading, tijdvak en voertuig.
  // Richting transporteur naar Bouwhub: accepteren, andere tijd voorstellen of weigeren, en vertrek en aflevering.
  // Later: de rit als transportopdracht aan de vervoerder vastleggen in Business Central.
  transportportaal: {
    naam: 'Transportportaal',
    richting: 'Bouwhub naar transporteur: ingeplande rit met adressen, lading, tijdvak en voertuig. Transporteur naar Bouwhub: accepteren, andere tijd voorstellen of weigeren, en vertrek en aflevering. Later vast te leggen als transportopdracht in Business Central.',
    ritVerstuurd(a, t, gewijzigd, extra) { Koppelingen.log('Transportportaal', 'Naar transporteur', `Rit ${a.id} ${gewijzigd ? 'bijgewerkt' : 'klaargezet'} in het portaal van ${t.naam}${extra ? ': ' + extra : ''}. Melding naar ${t.mail}.`, a.id); },
    reactie(a, t, tekst) { Koppelingen.log('Transportportaal', 'Transporteur naar Bouwhub', `${t.naam}: ${tekst}`, a.id); }
  },

  // Power Automate
  // Verbindt alles. Start bij een nieuwe aanvraag of wijziging vanuit de app, en bij een statuswijziging via een webhook vanuit Business Central.
  powerAutomate: {
    naam: 'Power Automate',
    richting: 'Start bij een nieuwe aanvraag of wijziging vanuit de app, en bij een statuswijziging via een webhook vanuit Business Central.',
    startProject(flow, p) { Koppelingen.log('Power Automate', 'Flow gestart', `Flow "${flow}" gestart voor project ${p.naam}.`, '', p.id); },
    start(flow, a) { Koppelingen.log('Power Automate', 'Flow gestart', `Flow "${flow}" gestart voor ${a.id}.`, a.id); }
  }
};

/* =====================================================================
   PROCESSEN (wat er gebeurt bij een actie)
   ===================================================================== */
function nieuweAanvraag(data, bestand) {
  const g = huidigeGebruiker();
  const a = Object.assign(data, { id: 'BH-' + S.volgendNr++, klantId: g.klantId, aanvragerId: g.id, status: 'Aangevraagd', aangemaakt: nu(), gepland: null, pakbon: null,
    history: [{ soort: 'status', status: 'Aangevraagd', tijd: nu(), door: g.naam, notitie: '' }] });
  S.aanvragen.unshift(a);
  Koppelingen.powerAutomate.start('Nieuwe aanvraag', a);
  Koppelingen.vierPS.aanvraagVersturen(a);
  if (bestand) { a.pakbon = { naam: bestand.name, grootte: bestand.size }; a.pakbon.pad = Koppelingen.sharepoint.pakbonOpslaan(a, a.pakbon); }
  Koppelingen.outlook.bevestiging(a);
  const p = proj(a.projectId);
  Koppelingen.teams.melding(a, `Nieuwe ${typeNaam(a).toLowerCase()}aanvraag ${a.id}`, `${p.naam}, ${a.type === 'transport' ? 'lossen ' + fmtDag(a.losdatum) + ', ' + a.tijdvak : 'inslag ' + fmtDag(a.inslagdatum)}. Aangevraagd door ${g.naam}.`);
  if (a.gekoppeld) { const o = aanv(a.gekoppeld); if (o) o.history.push({ soort: 'notitie', tijd: nu(), door: g.naam, notitie: `${a.losKeuze === 'hub' ? 'Inslagtransport' : 'Afroep'} ${a.id} aangevraagd.` }); }
  bewaar();
  return a;
}

function wijzigAanvraag(id, data, bestand) {
  const a = aanv(id); const g = huidigeGebruiker();
  const was = a.status;
  Object.assign(a, data);
  if (was === 'Bevestigd') { a.status = 'Aangevraagd'; a.history.push({ soort: 'status', status: 'Aangevraagd', tijd: nu(), door: g.naam, notitie: 'Gewijzigd door de klant. De Bouwhub bevestigt opnieuw.' }); }
  else a.history.push({ soort: 'notitie', tijd: nu(), door: g.naam, notitie: 'Aanvraag gewijzigd door de klant.' });
  Koppelingen.powerAutomate.start('Wijziging aanvraag', a);
  Koppelingen.vierPS.aanvraagBijwerken(a);
  if (bestand) { a.pakbon = { naam: bestand.name, grootte: bestand.size }; a.pakbon.pad = Koppelingen.sharepoint.pakbonOpslaan(a, a.pakbon); }
  Koppelingen.outlook.wijziging(a);
  Koppelingen.teams.melding(a, `Aanvraag ${a.id} gewijzigd`, `${proj(a.projectId).naam}. Controleer de wijziging en bevestig opnieuw.`);
  bewaar();
  return a;
}

function zetStatus(id, status, opties = {}) {
  const a = aanv(id); const g = huidigeGebruiker();
  if (opties.gepland) a.gepland = opties.gepland;
  a.status = status;
  a.history.push({ soort: 'status', status, tijd: nu(), door: g.naam, notitie: opties.notitie || '' });
  Koppelingen.vierPS.statusVastgelegd(a, status);
  Koppelingen.powerAutomate.start('Statuswijziging (webhook vanuit Business Central)', a);
  Koppelingen.outlook.status(a, status, opties.notitie);
  if (status === 'Geannuleerd') Koppelingen.teams.melding(a, `Aanvraag ${a.id} geannuleerd`, `${proj(a.projectId).naam}. Reden: ${opties.notitie || 'geen reden'}.`);
  bewaar();
  return a;
}

/* =====================================================================

   ===================================================================== */
const pill = s => `<span class="pill p-${PILL[s] || 'klaar'}">${esc(s)}</span>`;

function rij(a, metKlant) {
  const p = proj(a.projectId); const k = klant(a.klantId);
  const d = hoofdDatum(a); const tv = hoofdTijdvak(a);
  return `<li><button type="button" class="rij" data-act="open" data-id="${a.id}">
    <span class="rij-links">
      <span class="rij-boven"><span class="rij-id">${a.id}</span><span class="type">${typeNaam(a)}</span>${metKlant && k ? `<span>${esc(k.naam)}</span>` : ''}${metKlant ? ritTag(a) : ''}</span>
      <span class="rij-titel">${esc(p ? p.naam : 'Onbekend project')}</span>
      <span class="rij-meta">${a.type === 'transport' ? 'Lossen' : 'Inslag'} ${esc(dagKlein(d))}${tv ? ', ' + esc(tv) : ''}${a.type === 'transport' ? ` · ${a.losKeuze === 'hub' ? 'naar de hub' : a.losKeuze === 'ander' ? 'ander adres' : 'naar de bouwplaats'}` : ` · ${esc(m2Tekst(a.m2))}`}</span>
    </span>

  </button></li>`;
}
const sorteerOpDatum = (x, y) => String(hoofdDatum(x)).localeCompare(String(hoofdDatum(y))) || String(hoofdTijdvak(x)).localeCompare(String(hoofdTijdvak(y)));

  project: '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><path d="M3 21h18M5 21V5l8-3v19M13 9h6v12M8 8h2M8 12h2M8 16h2M16 13h1M16 17h1"/></svg>'
};
/* ---------- Klant: dashboard ---------- */
function vKlantDashboard() {
  const g = huidigeGebruiker(); const k = klant(g.klantId);
  const mijn = S.aanvragen.filter(a => a.klantId === g.klantId);
  const tab = UI.p.tab || 'lopend';
  const lopend = mijn.filter(a => !EIND.includes(a.status)).sort(sorteerOpDatum);
  const klaar = mijn.filter(a => EIND.includes(a.status)).sort((x, y) => sorteerOpDatum(y, x));
  const lijst = tab === 'lopend' ? lopend : klaar;
  return `<div class="pagina">
    <section class="intro"><p class="eyebrow">${esc(k ? k.naam : '')}</p><h1 tabindex="-1">Mijn aanvragen</h1><p class="sub">Vraag transport of opslag aan en volg hier de status.</p></section>
    <div class="tegels">
      <button type="button" class="tegel" data-act="nieuw" data-type="transport"><span class="tegel-icoon" aria-hidden="true">${ICOON.transport}</span><span class="tegel-titel">Transport aanvragen</span><span class="tegel-pijl" aria-hidden="true">→</span><span class="tegel-tekst">Levering naar de hub, de bouwplaats of een ander adres.</span></button>
      <button type="button" class="tegel" data-act="nieuw" data-type="opslag"><span class="tegel-icoon" aria-hidden="true">${ICOON.opslag}</span><span class="tegel-titel">Opslag aanvragen</span><span class="tegel-pijl" aria-hidden="true">→</span><span class="tegel-tekst">Goederen tijdelijk op de hub laten staan en later afroepen.</span></button>
      <button type="button" class="tegel" data-act="nav" data-view="k-project-nieuw"><span class="tegel-icoon" aria-hidden="true">${ICOON.project}</span><span class="tegel-titel">Nieuw project</span><span class="tegel-pijl" aria-hidden="true">→</span><span class="tegel-tekst">Uw project staat er nog niet bij? Meld het aan.</span></button>
    </div>
    <div class="tabs" role="tablist">
      <button type="button" role="tab" aria-selected="${tab === 'lopend'}" data-act="tab" data-tab="lopend">Lopend (${lopend.length})</button>
      <button type="button" role="tab" aria-selected="${tab === 'klaar'}" data-act="tab" data-tab="klaar">Afgerond (${klaar.length})</button>
    </div>
    ${lijst.length ? `<ul class="lijst">${lijst.map(a => rij(a)).join('')}</ul>` : `<p class="leeg">${tab === 'lopend' ? 'U heeft geen lopende aanvragen. Start hierboven een nieuwe aanvraag.' : 'Nog geen afgeronde aanvragen.'}</p>`}
  </div>`;
}

/* Zichtbaarheid van velden die van een keuze afhangen */
function pasZichtbaarheidToe(f) {
  f.querySelectorAll('[data-als]').forEach(el => {
    const m = el.dataset.als.match(/^(\w+)(!?=)(.+)$/); if (!m) return;
    const ctrl = f.elements[m[1]]; const w = ctrl ? ctrl.value : '';
    const lijst = m[3].split('|');
    el.hidden = m[2] === '=' ? !lijst.includes(w) : lijst.includes(w);
  });
  f.querySelectorAll('.regel').forEach(r => { r.querySelector('.regel-toel').hidden = r.querySelector('.r-soort').value !== 'Anders'; });
  const gs = f.querySelector('#gewicht-ster');
  if (gs) gs.hidden = !(f.elements.hijsen && f.elements.hijsen.value === 'Ja' && f.elements.losKeuze.value !== 'hub');
}

/* Project gekozen: adres en contactpersoon invullen als de klant ze nog niet zelf heeft aangepast */
function projectGekozen(f) {
  const p = proj(f.elements.projectId.value);
  const info = f.querySelector('#project-info'); if (info) info.innerHTML = projectInfoHTML(p);
  const adr = f.querySelector('#bouwplaats-adres'); if (adr) adr.textContent = p ? p.adres : 'Kies eerst een project.';
  if (!p) return;
  [['contactNaam', p.contactNaam], ['contactTel', p.contactTel], ['toegang', p.toegang]].forEach(([n, w]) => {
    const el = f.elements[n]; if (!el) return;

function leesFormulier(f) {

    inslagdatum: w('inslagdatum'), duurWeken: w('duurWeken'), afroep: w('afroep'), gevaarlijk: w('gevaarlijk'), gevaarlijkToelichting: w('gevaarlijkToelichting'), opmerkingen: w('opmerkingen'), gekoppeld: w('gekoppeld') || null };

const isGetal = s => s !== '' && !isNaN(Number(String(s).replace(',', '.'))) && Number(String(s).replace(',', '.')) > 0;

function verstuurFormulier(f) {
  const d = leesFormulier(f);
  const bestand = f.elements.pakbon && f.elements.pakbon.files ? f.elements.pakbon.files[0] : null;
  const bestaand = f.dataset.id ? aanv(f.dataset.id) : null;
  if (!toonFouten(f, valideer(d, bestaand, bestand))) return;
  if (d.type === 'opslag') d.m2 = Number(String(d.m2).replace(',', '.')), d.duurWeken = Number(d.duurWeken);
  if (bestaand) {
    const a = wijzigAanvraag(bestaand.id, d, bestand);
    toast(`Wijziging van ${a.id} opgeslagen`, 'Demo: naar 4PS, Outlook en Teams gestuurd');
    ga('k-detail', { id: a.id });
  } else {
    const a = nieuweAanvraag(d, bestand);
    ga('k-klaar', { id: a.id });
  }
}

function logLijst(log) {
  if (!log.length) return '<p class="notitie">Nog niets gebeurd.</p>';
  return `<ul class="log">${log.map(l => `<li><span class="log-sys">${esc(l.systeem)}</span><span class="log-tekst">${esc(l.tekst)}</span><span class="log-meta">${l.richting ? esc(l.richting) + ' · ' : ''}${fmtMoment(l.tijd)} · demo</span></li>`).join('')}</ul>`;
}
function statusverloop(a) {
  const flow = FLOW[a.type];
  const gestopt = ['Afgewezen', 'Geannuleerd'].includes(a.status);
  const statusEntries = a.history.filter(h => h.soort === 'status');
  const laatste = s => { for (let i = statusEntries.length - 1; i >= 0; i--) if (statusEntries[i].status === s) return statusEntries[i]; return null; };
  let huidigeIndex = flow.indexOf(a.status);
  if (gestopt) { const voor = statusEntries.filter(h => flow.includes(h.status)); huidigeIndex = voor.length ? flow.indexOf(voor[voor.length - 1].status) : 0; }
  const stappen = flow.map((s, i) => {
    const h = i <= huidigeIndex ? laatste(s) : null;
    const klasse = i < huidigeIndex || (i === huidigeIndex && (EIND.includes(a.status) || gestopt)) ? 'gedaan' : i === huidigeIndex ? 'huidig' : 'later';
    return `<li class="stap ${klasse}"><span class="stip" aria-hidden="true"></span><div><div class="stap-naam">${esc(s)}${klasse === 'huidig' ? ' <span class="notitie">(nu)</span>' : ''}</div>
      ${h ? `<div class="stap-meta">${fmtMoment(h.tijd)} · ${esc(h.door)}</div>${h.notitie ? `<div class="stap-meta">${esc(h.notitie)}</div>` : ''}` : ''}</div></li>`;
  });
  if (gestopt) {
    const h = laatste(a.status);
    stappen.splice(huidigeIndex + 1, flow.length, `<li class="stap stop"><span class="stip" aria-hidden="true"></span><div><div class="stap-naam">${esc(a.status)}</div>${h ? `<div class="stap-meta">${fmtMoment(h.tijd)} · ${esc(h.door)}</div>${h.notitie ? `<div class="stap-meta">Reden: ${esc(h.notitie)}</div>` : ''}` : ''}</div></li>`);
  }
  const notities = a.history.filter(h => h.soort === 'notitie');
  return `<ol class="verloop">${stappen.join('')}</ol>
    ${notities.length ? `<ul class="notities">${notities.map(n => `<li>${fmtMoment(n.tijd)} · ${esc(n.door)}: ${esc(n.notitie)}</li>`).join('')}</ul>` : ''}`;
}
function gegevens(a) {

  let h = kop('Algemeen') + r('Project', esc(`${p ? p.naam : ''} (${pnr(p)})`)) + r('Aanvrager', esc(`${g ? g.naam : ''}, ${k ? k.naam : ''}`)) + r('Aangevraagd op', fmtMoment(a.aangemaakt)) + r('Ingepland', gepland) + r('Transporteur', a.rit && UI.rol !== 'transporteur' ? esc(`${(transp(a.rit.transporteurId) || {}).naam || ''}${UI.rol !== 'klant' ? ' · ' + RIT_LABEL[a.rit.status].toLowerCase() : ''}`) : '') + r('Gekoppeld aan', gekoppeld);
  if (a.type === 'transport') {

    h += kop('Laden en lossen') + r('Laden', esc(`${adresTekst(a, 'laad')}, ${fmtDag(a.laaddatum)}`)) + r('Lossen', esc(`${adresTekst(a, 'los')}, ${fmtDag(a.losdatum)}, ${a.tijdvak}`));
    h += kop('Op locatie') + r('Contactpersoon', esc(`${a.contactNaam}, ${a.contactTel}`)) + r('Toegankelijkheid', esc(a.toegang)) + r('Kooiaap nodig', esc(a.kooiaap)) + r('Hijsen op locatie', esc(a.hijsen)) + r('Hijskraan aanwezig', esc(a.kraan)) + r('Voorkeur voertuig', esc(a.voertuig === 'Anders' ? a.voertuigAnders : a.voertuig));
  } else {
    h += kop('Goederen') + r('Omschrijving', esc(a.omschrijving)) + r('Lading', regels) + r('Vloeroppervlakte', esc(m2Tekst(a.m2))) + r('Gewicht', a.gewicht ? esc(a.gewicht + ' ton') : '') + r('Gevaarlijke stoffen', esc(a.gevaarlijk === 'Ja' ? 'Ja: ' + a.gevaarlijkToelichting : a.gevaarlijk));
    h += kop('Planning') + r('Inslag', esc(fmtDag(a.inslagdatum))) + r('Opslagduur', esc(`${a.duurWeken} weken, tot ongeveer ${fmtDag(plusDagen(a.inslagdatum, Number(a.duurWeken) * 7))}`)) + r('Afroep', esc(a.afroep)) + r('Opmerkingen', esc(a.opmerkingen));

function klantActies(a) {
  if (UI.p.annuleer) {
    return `<form class="actiebalk" id="annuleerform" novalidate>
      <h2>Aanvraag ${a.id} annuleren</h2>
      ${veld('reden', 'Waarom annuleert u?', true, `<textarea id="f-reden" name="reden" rows="2"></textarea>`)}

    </form>`;
  }
  const kan = CONFIG.wijzigbaarIn.includes(a.status);
  const knoppen = [];
  let tekstje = '';
  if (kan) {
    knoppen.push(`<button type="button" class="knop primair" data-act="wijzig" data-id="${a.id}">Wijzigen</button>`, `<button type="button" class="knop gevaar-licht" data-act="annuleer-open">Annuleren</button>`);
    tekstje = a.status === 'Bevestigd' ? 'U kunt deze aanvraag nog wijzigen of annuleren. Na een wijziging bevestigt de Bouwhub opnieuw.' : 'U kunt deze aanvraag nog wijzigen of annuleren tot de Bouwhub hem inplant.';
  } else if (!EIND.includes(a.status)) {
    tekstje = 'Deze aanvraag is ingepland en kan niet meer zelf gewijzigd worden. Neem voor wijzigingen contact op met de Bouwhub planning.';
  }
  if (a.type === 'opslag' && a.status === 'In opslag') { knoppen.unshift(`<button type="button" class="knop primair" data-act="afroep" data-id="${a.id}">Afroepen naar de bouwplaats</button>`); tekstje = 'De goederen staan op de hub. Roep ze in één keer of in delen af.'; }
  if (a.type === 'opslag' && ['Aangevraagd', 'Bevestigd'].includes(a.status)) knoppen.push(`<button type="button" class="knop" data-act="naar-hub" data-id="${a.id}">Transport naar de hub aanvragen</button>`);
  if (!tekstje && !knoppen.length) return '';
  return `<div class="actiebalk${kan || knoppen.length ? '' : ' rustig'}">${tekstje ? `<p>${esc(tekstje)}</p>` : ''}${knoppen.length ? `<div class="knoppen">${knoppen.join('')}</div>` : ''}</div>`;

    case 'Bevestigd': tekstje = 'Bevestigd. Plan de aanvraag in om datum, tijdvak en voertuig vast te leggen.'; knoppen = [`<button type="button" class="knop primair" data-act="inplan-open">Inplannen</button>`]; break;
    case 'Ingepland': tekstje = a.type === 'transport' ? 'Ingepland. De transporteur meldt vertrek en aflevering in zijn portaal. U kunt het hier ook zelf melden.' : 'Ingepland. Meld de goederen als ontvangen zodra ze op de hub staan.'; knoppen = [a.type === 'transport' ? knop('Onderweg', 'Op weg melden', true) : knop('In opslag', 'Ontvangen op de hub', true)]; break;

  return `<div class="actiebalk"><p>${esc(tekstje)}</p><div class="knoppen">${knoppen.join('')}</div></div>`;

/* ---------- Medewerker: binnengekomen ---------- */
function filterAanvragen() {
  const f = UI.f; const z = f.zoek.toLowerCase();
  return S.aanvragen.filter(a => {
    if (f.status === 'open' && EIND.includes(a.status)) return false;
    if (f.status === 'rit-actie') { if (!(a.status === 'Ingepland' && a.rit && ['voorstel', 'geweigerd'].includes(a.rit.status))) return false; }
    else if (f.status !== 'open' && f.status !== 'alle' && a.status !== f.status) return false;
    if (f.type !== 'alle' && a.type !== f.type) return false;
    if (f.project !== 'alle' && a.projectId !== f.project) return false;
    if (z) { const p = proj(a.projectId); const k = klant(a.klantId); if (![a.id, p && p.naam, p && p.nummer, k && k.naam].join(' ').toLowerCase().includes(z)) return false; }
    return true;
  }).sort((x, y) => (x.status === 'Aangevraagd' ? 0 : 1) - (y.status === 'Aangevraagd' ? 0 : 1) || sorteerOpDatum(x, y));
}

/* ---------- Medewerker: planning (weekschema) ---------- */
// Kleur per project, in vaste volgorde. Projecten na de vijfde krijgen grijs. De naam staat altijd in het blok.
const PROJECTKLEUR = ['#2a78d6', '#eb6834', '#6250d6', '#e87ba4', '#eda100'];
function projectKleur(id) { const i = S.projecten.findIndex(p => p.id === id); return i >= 0 && i < PROJECTKLEUR.length ? PROJECTKLEUR[i] : '#8a94a3'; }
function maandagVan(iso) { const [y, m, d] = iso.split('-').map(Number); const wd = (new Date(y, m - 1, d, 12).getDay() + 6) % 7; return plusDagen(iso, -wd); }
function weeknummer(iso) {
  const [y, m, d] = iso.split('-').map(Number); const dt = new Date(Date.UTC(y, m - 1, d));
  dt.setUTCDate(dt.getUTCDate() + 3 - (dt.getUTCDay() + 6) % 7);
  const jan4 = new Date(Date.UTC(dt.getUTCFullYear(), 0, 4));
  return 1 + Math.round(((dt - jan4) / 864e5 - 3 + (jan4.getUTCDay() + 6) % 7) / 7);
}
const PLAN_STATUS = ['Bevestigd', 'Ingepland', 'Onderweg', 'Geleverd', 'In opslag', 'Afgerond'];
const VERSLEEPBAAR = ['Bevestigd', 'Ingepland'];
function planVak(a) {
  // Waar staat de aanvraag in het schema? Ingepland gaat voor, anders de gewenste datum en het gewenste tijdvak van de klant.
  const datum = a.gepland ? a.gepland.datum : hoofdDatum(a);
  const tv = a.gepland ? (a.gepland.tijdvak || CONFIG.tijdvakken[0]) : hoofdTijdvak(a);
  return { datum, tijdvak: CONFIG.tijdvakken.includes(tv) ? tv : null };
}
function planFilter(a) {
  const f = UI.plan;
  return (f.soort === 'alle' || a.type === f.soort) && (f.project === 'alle' || a.projectId === f.project);
}
function blokje(a, opties = {}) {
  const p = proj(a.projectId);
  const gewenst = a.status === 'Bevestigd';
  const klaar = !VERSLEEPBAAR.includes(a.status);
  const sleep = !klaar;
  const meta = a.type === 'transport'
    ? `${regelsTekst(a.regels)}${a.gepland && a.gepland.voertuig ? ' · ' + a.gepland.voertuig : ''}`
    : `Inslag · ${m2Tekst(a.m2)}`;
  const naar = a.type === 'transport' ? (a.losKeuze === 'hub' ? 'naar hub' : a.losKeuze === 'ander' ? 'ander adres' : 'bouwplaats') : 'inslag hub';
  const statusTekst = gewenst ? 'Gewenst, nog inplannen' : a.status === 'Ingepland' ? '' : a.status;
  return `<button type="button" class="blokje${gewenst ? ' gewenst' : ''}${klaar ? ' klaar' : ''}${UI.plan.kies === a.id ? ' gekozen' : ''}" style="--k:${projectKleur(a.projectId)}"
      data-act="${sleep ? 'plan-kies' : 'open'}" data-id="${a.id}"${sleep ? ' draggable="true"' : ''}
      aria-label="${esc(`${a.id}, ${p ? p.naam : ''}, ${a.status}${sleep ? '. Klik om te verplaatsen.' : ''}`)}">
    <span class="b-id"><span>${a.id}</span><span>${esc(naar)}</span></span>
    <span class="b-proj">${esc(p ? p.naam : '')}</span>
    <span class="b-meta">${esc(meta)}</span>
    ${opties.metDatum ? `<span class="b-meta">${esc(fmtDag(planVak(a).datum))}${planVak(a).tijdvak ? ', ' + esc(planVak(a).tijdvak) : ''}</span>` : ''}
    ${a.rit && a.status === 'Ingepland' ? `<span class="b-rit r-${a.rit.status}">${esc((transp(a.rit.transporteurId) || {}).naam || '')}: ${esc(RIT_LABEL[a.rit.status].toLowerCase())}</span>` : ''}
    ${statusTekst ? `<span class="b-status">${esc(statusTekst)}</span>` : ''}
  </button>`;
}

function vPlanning() {
  UI.plan = UI.plan || { kies: null, weergave: 'week', soort: 'alle', project: 'alle' };
  UI.week = UI.week || maandagVan(dag(0));
  const schakel = `<div class="schakel" role="group" aria-label="Weergave">
      <button type="button" data-act="plan-weergave" data-w="week" aria-pressed="${UI.plan.weergave === 'week'}">Weekschema</button>
      <button type="button" data-act="plan-weergave" data-w="lijst" aria-pressed="${UI.plan.weergave === 'lijst'}">Lijst</button></div>`;
  const kop = `<section class="intro plan-intro"><div><p class="eyebrow">Bouwhub medewerker</p><h1 tabindex="-1">Planning</h1></div>${schakel}</section>`;
  if (UI.plan.weergave === 'lijst') return `<div class="pagina">${kop}${planLijst()}</div>`;

  const vandaag = dag(0);
  const ma = UI.week;
  const alleDagen = Array.from({ length: 7 }, (_, i) => plusDagen(ma, i));
  const inWeek = S.aanvragen.filter(a => PLAN_STATUS.includes(a.status) && planFilter(a)).map(a => ({ a, ...planVak(a) })).filter(x => x.tijdvak && alleDagen.includes(x.datum));
  const dagen = alleDagen.filter((d, i) => i < 5 || inWeek.some(x => x.datum === d));
  const inCel = (d, tv) => inWeek.filter(x => x.datum === d && x.tijdvak === tv).map(x => x.a).sort((x, y) => x.id.localeCompare(y.id));
  const ritten = arr => arr.filter(a => a.status !== 'Bevestigd').length;
  const nogInplannen = S.aanvragen.filter(a => a.status === 'Bevestigd' && planFilter(a)).sort(sorteerOpDatum);
  const nogBevestigen = S.aanvragen.filter(a => a.status === 'Aangevraagd').length;
  const gekozen = UI.plan.kies ? aanv(UI.plan.kies) : null;
  const [y] = ma.split('-');

  const kopRij = `<div class="schema-hoek">Tijdvak</div>` + dagen.map(d => {
    const n = ritten(inWeek.filter(x => x.datum === d).map(x => x.a));
    return `<div class="dagkop${d === vandaag ? ' vandaag' : ''}${d < vandaag ? ' voorbij' : ''}"><strong>${esc(fmtDag(d))}</strong><span>${d === vandaag ? 'Vandaag · ' : ''}${n} ${n === 1 ? 'rit' : 'ritten'}</span></div>`;
  }).join('');
  const rijen = CONFIG.tijdvakken.map(tv => `<div class="tvlabel">${esc(tv.replace(' tot ', ' tot '))}</div>` + dagen.map(d => {
    const lijst = inCel(d, tv); const n = ritten(lijst);
    const voorbij = d < vandaag; const vol = n > CONFIG.maxPerTijdvak;
    return `<div class="vak${voorbij ? ' verleden' : ''}${vol ? ' vol' : ''}" data-datum="${d}" data-tijdvak="${esc(tv)}"${!voorbij ? ` data-act="plan-vak"${gekozen ? ' tabindex="0" role="button"' : ''} aria-label="${esc(fmtDag(d) + ', ' + tv)}"` : ''}>
      ${vol ? `<span class="vol-label">${n} ritten, max ${CONFIG.maxPerTijdvak}</span>` : ''}${lijst.map(a => blokje(a)).join('')}</div>`;
  }).join('')).join('');

  const projectenInGebruik = S.projecten.filter(p => S.aanvragen.some(a => a.projectId === p.id && PLAN_STATUS.includes(a.status)));
  return `<div class="pagina">
    ${kop}
    <div class="week-balk">
      <div class="week-titel"><h2>Week ${weeknummer(ma)}</h2><span>${esc(fmtDag(ma))} tot ${esc(fmtDag(plusDagen(ma, 6)))} ${y}</span></div>
      <div class="knoppen">
        <button type="button" class="knop klein" data-act="week" data-stap="-7" aria-label="Vorige week">← Vorige</button>
        <button type="button" class="knop klein" data-act="week" data-stap="0"${ma === maandagVan(vandaag) ? ' disabled' : ''}>Deze week</button>
        <button type="button" class="knop klein" data-act="week" data-stap="7" aria-label="Volgende week">Volgende →</button>
      </div>
      <div class="plan-filters">
        <label class="vis-hidden" for="pf-soort">Soort</label><select id="pf-soort" data-planfilter="soort"><option value="alle">Transport en opslag</option><option value="transport"${UI.plan.soort === 'transport' ? ' selected' : ''}>Transport</option><option value="opslag"${UI.plan.soort === 'opslag' ? ' selected' : ''}>Opslag</option></select>
        <label class="vis-hidden" for="pf-project">Project</label><select id="pf-project" data-planfilter="project"><option value="alle">Alle projecten</option>${S.projecten.map(p => `<option value="${p.id}"${UI.plan.project === p.id ? ' selected' : ''}>${esc(p.naam)}</option>`).join('')}</select>
      </div>
    </div>
    <p class="veeg-hint">Veeg het schema opzij voor de andere dagen.</p>
    ${gekozen ? `<div class="kies-balk" role="status"><span><strong>${gekozen.id} ${esc(proj(gekozen.projectId).naam)}</strong> is gekozen. Klik op een vak in het schema om hem daar in te plannen.</span>
      <div class="knoppen"><button type="button" class="knop klein" data-act="open" data-id="${gekozen.id}">Aanvraag openen</button><button type="button" class="knop klein" data-act="plan-stop">Stoppen</button></div></div>` : ''}
    <div class="schema-wrap">
      <div class="schema-scroll${gekozen ? ' kies-actief' : ''}">
        <div class="schema" style="grid-template-columns: 92px repeat(${dagen.length}, minmax(156px, 1fr)); min-width: ${92 + dagen.length * 156}px">${kopRij}${rijen}</div>
      </div>
      <aside class="zijlijst">
        <section class="blok"><div class="blok-kop"><h2>Nog inplannen</h2><span class="notitie">${nogInplannen.length}</span></div>
          <p class="notitie">Bevestigd, nog zonder vaste planning. Sleep een blok naar het schema, of klik erop en kies een vak.</p>
          <div class="zij-blokken">${nogInplannen.map(a => blokje(a, { metDatum: true })).join('') || '<p class="notitie">Alles is ingepland.</p>'}</div>
          ${nogBevestigen ? `<button type="button" class="knop link" data-act="naar-bevestigen">${nogBevestigen} ${nogBevestigen === 1 ? 'aanvraag wacht' : 'aanvragen wachten'} nog op bevestiging</button>` : ''}
        </section>
        <section class="blok"><h2>Legenda</h2>
          <ul class="legenda-lijst">${projectenInGebruik.map(p => `<li><i style="--k:${projectKleur(p.id)}"></i>${esc(p.naam)}</li>`).join('')}</ul>
          <ul class="legenda-lijst stijlen">
            <li><i class="l-gewenst"></i>Gewenste datum van de klant, nog niet ingepland</li>
            <li><i class="l-vast"></i>Ingepland</li>
            <li><i class="l-klaar"></i>Onderweg of uitgevoerd</li>
            <li><i class="l-vol"></i>Meer dan ${CONFIG.maxPerTijdvak} ritten in één tijdvak</li>
          </ul>
        </section>
      </aside>
    </div>
  </div>`;
}

function planLijst() {
  const items = S.aanvragen.filter(a => ['Bevestigd', 'Ingepland', 'Onderweg'].includes(a.status)).sort(sorteerOpDatum);
  const groepen = {};
  items.forEach(a => { const d = hoofdDatum(a) || 'onbekend'; (groepen[d] = groepen[d] || []).push(a); });
  const vandaag = dag(0);
  return Object.keys(groepen).sort().map(d => `<section class="dag-groep">
      <div class="dag-kop"><h2>${d === 'onbekend' ? 'Geen datum' : esc(dagTekst(d))}</h2><span class="teller-tekst">${groepen[d].length} ${groepen[d].length === 1 ? 'aanvraag' : 'aanvragen'}</span>${d < vandaag ? '<span class="waarschuwing">Datum is voorbij, nog niet afgerond</span>' : ''}</div>
      <ul class="lijst">${groepen[d].map(a => rij(a, true)).join('')}</ul></section>`).join('') || '<p class="leeg">Er staat niets op de planning.</p>';
}

// Een aanvraag op een dag en tijdvak zetten. Bevestigd wordt Ingepland, Ingepland wordt verplaatst.
function plaatsAanvraag(id, datum, tijdvak) {
  const a = aanv(id); if (!a || !VERSLEEPBAAR.includes(a.status)) return;
  if (datum < dag(0)) { toast('Dit vak ligt in het verleden', 'Kies een dag vanaf vandaag.'); return; }
  const g = huidigeGebruiker();
  if (a.status === 'Bevestigd') {
    const voorkeur = a.voertuig && !['Geen voorkeur', 'Anders'].includes(a.voertuig) ? a.voertuig : 'Bakwagen';
    const gepland = { datum, tijdvak }; if (a.type === 'transport') gepland.voertuig = voorkeur;
    zetStatus(id, 'Ingepland', { gepland });
    if (a.type === 'transport') { stuurRit(a, kiesTransporteur(voorkeur)); bewaar(); }
    toast(`${a.id} ingepland op ${fmtDag(datum)}, ${tijdvak}`, a.type === 'transport' ? `Demo: rit naar ${transp(a.rit.transporteurId).naam}, mail naar de klant` : 'Demo: planning naar Business Central, mail naar de klant');
  } else {
    if (a.gepland && a.gepland.datum === datum && a.gepland.tijdvak === tijdvak) return;
    const oud = a.gepland ? `${fmtDag(a.gepland.datum)}, ${a.gepland.tijdvak}` : 'onbekend';
    a.gepland = Object.assign({}, a.gepland, { datum, tijdvak });
    a.history.push({ soort: 'notitie', tijd: nu(), door: g.naam, notitie: `Verplaatst van ${oud} naar ${fmtDag(datum)}, ${tijdvak}.` });
    Koppelingen.vierPS.planningGewijzigd(a);
    Koppelingen.powerAutomate.start('Planning gewijzigd (webhook vanuit Business Central)', a);
    Koppelingen.outlook.planning(a, oud);
    if (a.rit) stuurRit(a, a.rit.transporteurId, true);
    bewaar();
    toast(`${a.id} verplaatst naar ${fmtDag(datum)}, ${tijdvak}`, a.rit ? `Demo: rit opnieuw naar ${transp(a.rit.transporteurId).naam}, mail naar de klant` : 'Demo: Business Central bijgewerkt, mail naar de klant');
  }
  UI.plan.kies = null;
  render();
}

/* ---------- Transporteurs en ritten ---------- */
// Plant de Bouwhub een transport in, dan gaat de rit naar het portaal van de transporteur.
// De transporteur accepteert, stelt een andere datum of tijd voor, of weigert. Daarna meldt hij vertrek en aflevering.
const RIT_LABEL = { nieuw: 'Te accepteren', geaccepteerd: 'Geaccepteerd', voorstel: 'Wijziging voorgesteld', geweigerd: 'Geweigerd' };
const RIT_PILL = { nieuw: 'aan', geaccepteerd: 'bev', voorstel: 'plan', geweigerd: 'stop' };
const transp = id => (S.transporteurs || []).find(t => t.id === id);
const transporteurGebruikers = () => S.gebruikers.filter(g => g.rol === 'transporteur' && g.actief !== false);
const ritVoertuigen = () => CONFIG.voertuigen.filter(x => x !== 'Geen voorkeur' && x !== 'Anders');
function kiesTransporteur(voertuig, lijst) {
  const l = (lijst || S.transporteurs || []).filter(t => t.actief !== false);
  return ((l.find(t => (t.voertuigen || []).includes(voertuig)) || l[0]) || {}).id || '';
}
const ritPill = a => a.rit ? `<span class="pill p-${RIT_PILL[a.rit.status]}">${esc(RIT_LABEL[a.rit.status])}</span>` : '';
const ritTag = a => a.rit && a.status === 'Ingepland' ? `<span class="rit-tag r-${a.rit.status}">${esc((transp(a.rit.transporteurId) || {}).naam || '')}: ${esc(RIT_LABEL[a.rit.status].toLowerCase())}</span>` : '';
function transporteurOpties(geselecteerd) {
  return keuzelijst('transporteur', S.transporteurs.filter(t => t.actief !== false).map(t => ({ v: t.id, t: `${t.naam} (${(t.voertuigen || []).join(', ')})` })), geselecteerd);
}

function stuurRit(a, transporteurId, gewijzigd) {
  if (a.type !== 'transport') return;
  const t = transp(transporteurId); if (!t) return;
  const zelfde = a.rit && a.rit.transporteurId === transporteurId;
  a.rit = { transporteurId, status: 'nieuw', verstuurd: nu(), kenteken: zelfde ? a.rit.kenteken || '' : '', chauffeur: zelfde ? a.rit.chauffeur || '' : '', chauffeurTel: zelfde ? a.rit.chauffeurTel || '' : '', voorstel: null, reden: '' };
  a.history.push({ soort: 'notitie', tijd: nu(), door: huidigeGebruiker().naam, notitie: `${gewijzigd ? 'Gewijzigde rit' : 'Rit'} naar ${t.naam} gestuurd. Wacht op acceptatie.` });
  Koppelingen.transportportaal.ritVerstuurd(a, t, gewijzigd);
}
function ritAccepteer(id, extra) {
  const a = aanv(id); const t = transp(a.rit.transporteurId);
  Object.assign(a.rit, extra, { status: 'geaccepteerd', beantwoord: nu() });
  a.history.push({ soort: 'notitie', tijd: nu(), door: huidigeGebruiker().naam, notitie: `Rit geaccepteerd door ${t.naam}${extra.kenteken ? ', kenteken ' + extra.kenteken : ''}${extra.chauffeur ? ', chauffeur ' + extra.chauffeur : ''}.` });
  Koppelingen.transportportaal.reactie(a, t, `rit ${a.id} geaccepteerd.`);
  Koppelingen.vierPS.transportopdracht(a, t);
  bewaar();
}
function ritVoorstel(id, v) {
  const a = aanv(id); const t = transp(a.rit.transporteurId);
  Object.assign(a.rit, { status: 'voorstel', voorstel: Object.assign({ tijd: nu() }, v) });
  a.history.push({ soort: 'notitie', tijd: nu(), door: huidigeGebruiker().naam, notitie: `${t.naam} stelt voor: ${fmtDag(v.datum)}, ${v.tijdvak}${v.voertuig ? ', ' + v.voertuig : ''}. Reden: ${v.reden}` });
  Koppelingen.transportportaal.reactie(a, t, `stelt voor ${a.id} te verplaatsen naar ${fmtDag(v.datum)}, ${v.tijdvak}.`);
  Koppelingen.teams.melding(a, `Wijziging voorgesteld voor ${a.id}`, `${t.naam} stelt voor: ${fmtDag(v.datum)}, ${v.tijdvak}. Reden: ${v.reden}`);
  bewaar();
}
function ritWeiger(id, reden) {
  const a = aanv(id); const t = transp(a.rit.transporteurId);
  Object.assign(a.rit, { status: 'geweigerd', reden, voorstel: null });
  a.history.push({ soort: 'notitie', tijd: nu(), door: huidigeGebruiker().naam, notitie: `Rit geweigerd door ${t.naam}. Reden: ${reden}` });
  Koppelingen.transportportaal.reactie(a, t, `rit ${a.id} geweigerd.`);
  Koppelingen.teams.melding(a, `Rit ${a.id} geweigerd`, `${t.naam} kan de rit niet rijden. Reden: ${reden}. Kies een andere transporteur.`);
  bewaar();
}
function voorstelOvernemen(id) {
  const a = aanv(id); const t = transp(a.rit.transporteurId); const v = a.rit.voorstel;
  const oud = `${fmtDag(a.gepland.datum)}, ${a.gepland.tijdvak}`;
  a.gepland = Object.assign({}, a.gepland, { datum: v.datum, tijdvak: v.tijdvak }, v.voertuig ? { voertuig: v.voertuig } : {});
  Object.assign(a.rit, { status: 'geaccepteerd', voorstel: null, beantwoord: nu() });
  a.history.push({ soort: 'notitie', tijd: nu(), door: huidigeGebruiker().naam, notitie: `Voorstel van ${t.naam} overgenomen. Nieuwe planning: ${fmtDag(v.datum)}, ${v.tijdvak}.` });
  Koppelingen.vierPS.planningGewijzigd(a);
  Koppelingen.transportportaal.ritVerstuurd(a, t, true, 'Voorstel goedgekeurd door de Bouwhub');
  Koppelingen.outlook.planning(a, oud);
  bewaar();
}
function voorstelAfwijzen(id) {
  const a = aanv(id); const t = transp(a.rit.transporteurId);
  Object.assign(a.rit, { status: 'nieuw', voorstel: null });
  a.history.push({ soort: 'notitie', tijd: nu(), door: huidigeGebruiker().naam, notitie: `Voorstel van ${t.naam} afgewezen. De oorspronkelijke planning blijft staan.` });
  Koppelingen.transportportaal.ritVerstuurd(a, t, true, 'Voorstel afgewezen, oorspronkelijke planning blijft');
  bewaar();
}

/* Transporteur: overzicht */
function transRij(a) {
  const p = proj(a.projectId); const gp = a.gepland || {};
  const laad = a.laadKeuze === 'hub' ? 'Bouwhub' : (a.laadadres || '').split(',')[0].trim();
  const los = a.losKeuze === 'hub' ? 'Bouwhub' : a.losKeuze === 'ander' ? (a.losadres || '').split(',')[0].trim() : (p ? p.naam : '');
  return `<li><button type="button" class="rij" data-act="open" data-id="${a.id}">
    <span class="rij-links">
      <span class="rij-boven"><span class="rij-id">${a.id}</span><span>${esc(dagKlein(gp.datum))}, ${esc(gp.tijdvak || '')}</span><span>${esc(gp.voertuig || '')}</span></span>
      <span class="rij-titel">${esc(laad)} → ${esc(los)}</span>
      <span class="rij-meta">${esc(regelsTekst(a.regels))}${a.gewicht ? ' · ' + esc(a.gewicht) + ' ton' : ''}${a.hijsen === 'Ja' ? ' · hijsen' : ''}${a.kooiaap === 'Ja' ? ' · kooiaap' : ''}</span>
    </span>
    ${a.status === 'Ingepland' ? ritPill(a) : pill(a.status)}
  </button></li>`;
}
function mijnRitten() {
  const g = huidigeGebruiker();
  return S.aanvragen.filter(a => a.rit && a.rit.transporteurId === g.transporteurId);
}
function vTransRitten() {
  const g = huidigeGebruiker(); const t = transp(g.transporteurId) || { naam: '' };
  const open = mijnRitten().filter(a => ['Ingepland', 'Onderweg'].includes(a.status) && a.rit.status !== 'geweigerd');
  const teDoen = open.filter(a => a.status === 'Ingepland' && a.rit.status === 'nieuw').sort(sorteerOpDatum);
  const wacht = open.filter(a => a.status === 'Ingepland' && a.rit.status === 'voorstel').sort(sorteerOpDatum);
  const gepland = open.filter(a => a.status === 'Onderweg' || a.rit.status === 'geaccepteerd').sort(sorteerOpDatum);
  const groepen = {}; gepland.forEach(a => { (groepen[a.gepland.datum] = groepen[a.gepland.datum] || []).push(a); });
  const vandaag = gepland.filter(a => a.gepland.datum === dag(0)).length;
  const sectie = (titel, uitleg, lijst) => lijst.length ? `<section class="dag-groep"><div class="dag-kop"><h2>${titel}</h2><span class="teller-tekst">${lijst.length}</span></div>${uitleg ? `<p class="notitie">${uitleg}</p>` : ''}<ul class="lijst">${lijst.map(transRij).join('')}</ul></section>` : '';
