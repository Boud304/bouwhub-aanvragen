/* ---------- Beheerder: kerncijfers ---------- */
function urenTussen(a, van, tot) {
  const h1 = a.history.find(h => h.soort === 'status' && h.status === van); const h2 = a.history.find(h => h.soort === 'status' && h.status === tot);
  return h1 && h2 ? (new Date(h2.tijd) - new Date(h1.tijd)) / 36e5 : null;
}
const gemiddelde = arr => arr.length ? arr.reduce((t, x) => t + x, 0) / arr.length : null;
const nl = (n, d = 1) => n == null ? 'geen data' : n.toLocaleString('nl-NL', { maximumFractionDigits: d, minimumFractionDigits: 0 });
function vCijfers() {
  const alle = S.aanvragen;
  const open = alle.filter(a => !EIND.includes(a.status)).length;
  const telling = ALLE_STATUSSEN.map(s => ({ s, n: alle.filter(a => a.status === s).length }));
  const max = Math.max(1, ...telling.map(t => t.n));
  const bezet = alle.filter(a => a.type === 'opslag' && a.status === 'In opslag').reduce((t, a) => t + Number(a.m2 || 0), 0);
  const gereserveerd = alle.filter(a => a.type === 'opslag' && ['Aangevraagd', 'Bevestigd', 'Ingepland'].includes(a.status)).reduce((t, a) => t + Number(a.m2 || 0), 0);
  const cap = CONFIG.opslagCapaciteitM2;
  const pct = Math.round(bezet / cap * 100);
  const totBevestiging = gemiddelde(alle.map(a => urenTussen(a, 'Aangevraagd', 'Bevestigd')).filter(x => x != null));
  const totLevering = gemiddelde(alle.filter(a => a.type === 'transport').map(a => urenTussen(a, 'Aangevraagd', 'Geleverd')).filter(x => x != null));
  const perProject = S.projecten.map(p => {
    const l = alle.filter(a => a.projectId === p.id);
    return { p, totaal: l.length, open: l.filter(a => !EIND.includes(a.status)).length, pp: l.filter(a => a.type === 'opslag' && a.status === 'In opslag').reduce((t, a) => t + Number(a.m2 || 0), 0) };
  }).sort((x, y) => y.totaal - x.totaal);
  const b = Math.min(100, bezet / cap * 100), r = Math.min(100 - b, gereserveerd / cap * 100);
  return `<div class="pagina">
    <section class="intro"><p class="eyebrow">Beheer · voorbeeld van Power BI <span class="demo-tag">Demo</span></p><h1 tabindex="-1">Kerncijfers</h1>
      <p class="sub">Zo ziet het overzicht er later in Power BI uit. Dan komen de cijfers uit Business Central. Nu worden ze berekend uit de nepdata in dit prototype.</p></section>
    <div class="stats">
      <div class="stat"><span class="stat-label">Open aanvragen</span><span class="stat-waarde">${open}</span><span class="stat-sub">van ${alle.length} in totaal</span></div>
      <div class="stat"><span class="stat-label">Bezetting opslag</span><span class="stat-waarde">${pct}%</span><span class="stat-sub">${nl(bezet)} van ${cap} m²</span></div>
      <div class="stat"><span class="stat-label">Van aanvraag tot bevestiging</span><span class="stat-waarde">${nl(totBevestiging)} uur</span><span class="stat-sub">gemiddeld</span></div>
      <div class="stat"><span class="stat-label">Van aanvraag tot levering</span><span class="stat-waarde">${totLevering == null ? 'geen data' : nl(totLevering / 24) + ' dagen'}</span><span class="stat-sub">gemiddeld, alleen transport</span></div>
    </div>
    <div class="detail-grid gelijk">
      <section class="blok"><h2>Aanvragen per status</h2>
        <div class="balken" role="list">${telling.map(t => `<div class="balk-rij" role="listitem" title="${esc(t.s)}: ${t.n}"><span>${esc(t.s)}</span><span class="balk-spoor"><span class="balk-vul" style="display:block;width:${(t.n / max * 100).toFixed(1)}%"></span></span><span class="num">${t.n}</span></div>`).join('')}</div>
      </section>
      <section class="blok"><h2>Bezetting van de opslag</h2>
        <div class="meter" role="img" aria-label="${nl(bezet)} m² bezet en ${nl(gereserveerd)} m² gereserveerd van ${cap} m²" title="${nl(bezet)} m² bezet, ${nl(gereserveerd)} m² gereserveerd, ${cap} m² totaal">
          <span class="meter-bezet" style="width:${b.toFixed(1)}%"></span><span class="meter-gereserveerd" style="width:${r.toFixed(1)}%"></span></div>
        <div class="legenda"><span><i style="background:var(--chart)"></i>In opslag: ${nl(bezet)} m²</span><span><i style="background:var(--chart-2)"></i>Aangevraagd of ingepland: ${nl(gereserveerd)} m²</span><span>Vrij: ${nl(Math.max(0, cap - bezet - gereserveerd))} m²</span></div>
        <p class="notitie">Een opslagvloer van ${cap} m² is een aanname. Pas het aan bovenin de code bij CONFIG.</p>
      </section>
    </div>
    <section class="pagina" style="gap:10px"><h2>Per project</h2>
      <div class="tabel-wrap"><table><thead><tr><th>Project</th><th>Nummer</th><th class="num">Aanvragen</th><th class="num">Open</th><th class="num">In opslag (m²)</th></tr></thead>
      <tbody>${perProject.map(x => `<tr><td>${esc(x.p.naam)}</td><td class="nowrap">${esc(pnr(x.p))}</td><td class="num">${x.totaal}</td><td class="num">${x.open}</td><td class="num">${nl(x.pp)}</td></tr>`).join('')}</tbody></table></div>
    </section>
  </div>`;
}

function leesProjectAanmelding(f) {

}
function valideerProjectAanmelding(d, klantId) {
  const fouten = {};
  if (!d.naam) fouten.naam = 'Vul een projectnaam in.';
  else if (S.projecten.some(p => (p.klanten || []).includes(klantId) && projectStatus(p) !== 'Afgewezen' && p.naam.toLowerCase() === d.naam.toLowerCase())) fouten.naam = 'Uw bedrijf heeft al een project met deze naam. Kies een andere naam of gebruik het bestaande project.';
  if (!d.straat) fouten.straat = 'Vul de straat en huisnummers van de bouwplaats in.';
  if (d.postcode && !/^\d{4}\s?[A-Z]{2}$/.test(d.postcode)) fouten.postcode = 'Vul de postcode in als 1234 AB.';
  if (!d.plaats) fouten.plaats = 'Vul de plaats of het stadsdeel in.';
  if (!d.startdatum) fouten.startdatum = 'Kies de verwachte startdatum.';
  if (d.einddatum && d.startdatum && d.einddatum < d.startdatum) fouten.einddatum = 'De oplevering ligt voor de start.';
  if (!d.contactNaam) fouten.contactNaam = 'Vul de naam van de contactpersoon op locatie in.';
  if (!d.contactTel) fouten.contactTel = 'Vul het telefoonnummer in.';
  else if ((d.contactTel.match(/\d/g) || []).length < 10) fouten.contactTel = 'Vul een telefoonnummer van minimaal 10 cijfers in.';
  return fouten;
}
function meldProjectAan(d) {
  const g = huidigeGebruiker();
  const p = Object.assign({ id: 'P' + (Math.max(0, ...S.projecten.map(x => Number(x.id.slice(1)) || 0)) + 1), nummer: '', status: 'Aangemeld', klanten: [g.klantId], aangemeldDoor: g.id, aangemeldOp: nu() }, d);
  if (p.postcode && !p.postcode.includes(' ')) p.postcode = p.postcode.slice(0, 4) + ' ' + p.postcode.slice(4);
  p.adres = `${p.straat}, ${p.postcode ? p.postcode + ' ' : ''}${p.plaats}`;
  S.projecten.push(p);
  Koppelingen.powerAutomate.startProject('Nieuwe projectaanmelding', p);
  Koppelingen.vierPS.projectAangemeld(p);
  Koppelingen.outlook.projectMail(p, `Ontvangen: aanmelding project ${p.naam}`, [

    <section class="blok"><h2>Wat is anders dan het huidige vrachtformulier</h2><ul class="info-lijst">

      if (!fouten.datum && w('datum') === a.gepland.datum && w('tijdvak') === a.gepland.tijdvak && (!w('voertuig') || w('voertuig') === a.gepland.voertuig)) fouten.datum = 'Dit is de huidige planning. Kies een andere datum, tijd of voertuig.';
      if (!toonEenvoudig(f, fouten)) return;
      ritVoorstel(a.id, { datum: w('datum'), tijdvak: w('tijdvak'), voertuig: w('voertuig'), reden: w('reden') }); UI.p.voorstel = false;
      toast('Voorstel verstuurd naar de Bouwhub', 'Demo: Teams melding aan het planningsteam'); render(); break;
    }
    case 'ritweigerform': {
      if (!w('reden')) { veldFout(f, 'reden', 'Vul een reden in voor de Bouwhub.'); return; }
      ritWeiger(UI.p.id, w('reden')); UI.p.weiger = false;
      toast(`Rit ${UI.p.id} geweigerd`, 'Demo: de Bouwhub kiest een andere transporteur'); render(); break;
    }
    case 'ritwissel': {
      const a = aanv(f.dataset.id); const tid = w('transporteur');
      stuurRit(a, tid, a.rit && a.rit.transporteurId === tid); bewaar();
      toast(`Rit ${a.id} verstuurd naar ${transp(tid).naam}`, 'Demo: zichtbaar in het transportportaal'); render(); break;
    }
    case 'transporteurform': {
      const fouten = {}; if (!w('naam')) fouten.naam = 'Vul een bedrijfsnaam in.';
      if (!w('mail')) fouten.mail = 'Vul een mailadres in.'; else if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(w('mail'))) fouten.mail = 'Vul een geldig mailadres in.';
      const vt = [...f.querySelectorAll('input[name="voertuigen"]:checked')].map(x => x.value);
      if (!vt.length) fouten.voertuigen = 'Kies minimaal één voertuig.';
      if (!toonEenvoudig(f, fouten)) return;
      let t = transp(f.dataset.id);
      if (!t) { t = { id: volgendId(S.transporteurs, 'T') }; S.transporteurs.push(t); }
      Object.assign(t, { naam: w('naam'), mail: w('mail'), tel: w('tel'), voertuigen: vt, actief: f.elements.actief.checked });
      bewaar(); UI.p.bewerk = null; toast(`Transporteur ${t.naam} opgeslagen`); render(); break;
    }
    case 'projectform': {
      const fouten = {}; if (!w('naam')) fouten.naam = 'Vul een projectnaam in.'; if (!w('nummer')) fouten.nummer = 'Vul een projectnummer in.'; if (!w('adres')) fouten.adres = 'Vul het adres van de bouwplaats in.';
      if (!toonEenvoudig(f, fouten)) return;
      let p = proj(f.dataset.id);
      if (!p) { p = { id: 'P' + (Math.max(0, ...S.projecten.map(x => Number(x.id.slice(1)))) + 1) }; S.projecten.push(p); }
      Object.assign(p, { naam: w('naam'), nummer: w('nummer'), adres: w('adres'), toegang: w('toegang'), contactNaam: w('contactNaam'), contactTel: w('contactTel'), klanten: [...f.querySelectorAll('input[name="klanten"]:checked')].map(x => x.value) });
      Koppelingen.vierPS.projectGegevens(p); bewaar(); UI.p.bewerk = null; toast(`Project ${p.naam} opgeslagen`); render(); break;
    }
    case 'klantform': {
      const fouten = {}; if (!w('naam')) fouten.naam = 'Vul een bedrijfsnaam in.';
      if (!toonEenvoudig(f, fouten)) return;
      let k = klant(f.dataset.id);
      if (!k) { k = { id: 'K' + (Math.max(0, ...S.klanten.map(x => Number(x.id.slice(1)))) + 1) }; S.klanten.push(k); }
      Object.assign(k, { naam: w('naam'), soort: w('soort') });
      const gekozen = [...f.querySelectorAll('input[name="projecten"]:checked')].map(x => x.value);
      S.projecten.forEach(p => { p.klanten = (p.klanten || []).filter(id => id !== k.id); if (gekozen.includes(p.id)) p.klanten.push(k.id); });
      bewaar(); UI.p.bewerk = null; toast(`Klant ${k.naam} opgeslagen`); render(); break;
    }
    case 'gebruikerform': {
      const fouten = {}; if (!w('naam')) fouten.naam = 'Vul een naam in.';
      if (!w('mail')) fouten.mail = 'Vul een mailadres in.'; else if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(w('mail'))) fouten.mail = 'Vul een geldig mailadres in, zoals naam@bedrijf.nl.';
      if (w('rol') === 'klant' && !w('klantId')) fouten.klantId = 'Kies bij welke klant deze gebruiker hoort.';
      if (w('rol') === 'transporteur' && !w('transporteurId')) fouten.transporteurId = 'Kies bij welke transporteur deze gebruiker hoort.';
      if (!toonEenvoudig(f, fouten)) return;
      let g = gebr(f.dataset.id);
      if (!g) { g = { id: volgendId(S.gebruikers, 'U') }; S.gebruikers.push(g); }
      Object.assign(g, { naam: w('naam'), mail: w('mail'), tel: w('tel'), rol: w('rol'), klantId: w('rol') === 'klant' ? w('klantId') : '', transporteurId: w('rol') === 'transporteur' ? w('transporteurId') : '', actief: f.elements.actief.checked });
      bewaar(); UI.p.bewerk = null; toast(`Gebruiker ${g.naam} opgeslagen`); render(); break;
    }
  }
});
function veldFout(f, naam, msg) { toonEenvoudig(f, { [naam]: msg }); }
function toonEenvoudig(f, fouten) {
  f.querySelectorAll('.heeft-fout').forEach(el => el.classList.remove('heeft-fout'));
  f.querySelectorAll('.fout').forEach(el => { el.hidden = true; });
  f.querySelectorAll('[aria-invalid]').forEach(el => el.removeAttribute('aria-invalid'));
  let eerste = null;
  Object.entries(fouten).forEach(([naam, msg]) => {
    const wrap = f.querySelector(`[data-veld="${naam}"]`); const p = f.querySelector(`#fout-${naam}`); const c = f.querySelector(`#f-${naam}`);
    if (wrap) wrap.classList.add('heeft-fout'); if (p) { p.textContent = msg; p.hidden = false; }
    if (c) { c.setAttribute('aria-invalid', 'true'); if (!eerste) eerste = c; }
  });
  if (eerste) eerste.focus();
  return !Object.keys(fouten).length;
}

/* Start */
UI.logGezien = S.log.length;
render();
